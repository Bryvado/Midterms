name: ENR watchdog

# Every 5 minutes on odd minutes, from main only. The script exits at once outside the election-night window
# (set at the top of enr/watchdog.sh); inside it, it starts the recorder or restarts a missing, hung or stale one.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_replay:
        description: Test on enr-replay with a replay source, ignoring the window
        type: boolean
        default: false
      dry_run:
        description: Print what would be cancelled and dispatched, without doing it
        type: boolean
        default: false
      now_utc:
        description: Pretend the current time is this (dry runs only), e.g. 2026-11-04T01:00:00Z
        default: ""

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: enr-watchdog
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: enr/watchdog.sh
          sparse-checkout-cone-mode: false
      - name: Check the recorder
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_REPLAY: ${{ inputs.test_replay || 'false' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          NOW_OVERRIDE: ${{ inputs.dry_run && inputs.now_utc || '' }}
        run: bash enr/watchdog.sh
