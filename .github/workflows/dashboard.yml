name: Render and deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "data/published/**"
      - "dashboard/**"
      - "scripts/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::here
            any::readr
            any::dplyr
            any::sf
            any::mapgl
            any::plotly
            any::DT
            any::knitr
            any::rmarkdown
      - name: Install tippecanoe
        if: hashFiles('data/published/regions.geojson') != ''
        run: |
          if ! (sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe); then
            sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev
            git clone --depth 1 https://github.com/felt/tippecanoe.git "$RUNNER_TEMP/tippecanoe"
            make -C "$RUNNER_TEMP/tippecanoe" -j"$(nproc)"
            sudo make -C "$RUNNER_TEMP/tippecanoe" install
          fi
          tippecanoe --version
      - name: Render
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: quarto render dashboard
      - name: Build regions.pmtiles
        if: hashFiles('data/published/regions.geojson') != ''
        run: |
          Rscript scripts/build_tiles.R "$RUNNER_TEMP/regions_joined.geojson"
          tippecanoe -o dashboard/_site/regions.pmtiles -l regions \
            --detect-shared-borders --no-tiny-polygon-reduction \
            -zg --maximum-tile-bytes=1500000 --force \
            "$RUNNER_TEMP/regions_joined.geojson"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
