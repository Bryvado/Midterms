name: Build and deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "data/published/**"
      - "dashboard/**"
      - "scripts/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - id: tile-cache
        uses: actions/cache@v4
        with:
          path: dashboard/.tile-cache
          key: tiles-${{ runner.os }}-${{ hashFiles('data/published/regions.geojson', 'data/published/counties.geojson', 'data/published/regional_projections.csv', 'data/published/county_projections.csv', 'scripts/build_tiles.R') }}
      - uses: r-lib/actions/setup-r@v2
        if: steps.tile-cache.outputs.cache-hit != 'true'
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.tile-cache.outputs.cache-hit != 'true'
        with:
          packages: |
            any::here
            any::readr
            any::dplyr
            any::sf
      - name: Install tippecanoe
        if: steps.tile-cache.outputs.cache-hit != 'true' && hashFiles('data/published/regions.geojson') != ''
        run: |
          if ! (sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe); then
            sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev
            git clone --depth 1 https://github.com/felt/tippecanoe.git "$RUNNER_TEMP/tippecanoe"
            make -C "$RUNNER_TEMP/tippecanoe" -j"$(nproc)"
            sudo make -C "$RUNNER_TEMP/tippecanoe" install
          fi
          tippecanoe --version
      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - name: Build map tiles
        if: steps.tile-cache.outputs.cache-hit != 'true' && hashFiles('data/published/regions.geojson') != ''
        run: |
          mkdir -p dashboard/.tile-cache
          tile() {
            local name="$1"; shift
            tippecanoe -o "dashboard/.tile-cache/$name.pmtiles" -l regions \
              --detect-shared-borders -zg --force "$@" \
              "$RUNNER_TEMP/${name}_joined.geojson"
          }
          build() {
            local name="$1" geo="$2" csv="$3" unit="$4"
            Rscript scripts/build_tiles.R "$RUNNER_TEMP/${name}_joined.geojson" "$geo" "$csv" "$unit"
            if ! tile "$name"; then
              echo "::warning::$name tile over 500 KB; retrying with --no-tile-size-limit"
              tile "$name" --no-tile-size-limit
            fi
          }
          build regions regions.geojson regional_projections.csv precinct
          if [ -f data/published/counties.geojson ]; then
            build counties counties.geojson county_projections.csv county
          fi
      - name: Copy map tiles into site
        run: cp dashboard/.tile-cache/*.pmtiles dashboard/dist/
      - name: Report largest tile per zoom
        if: hashFiles('data/published/regions.geojson') != ''
        run: |
          pip install --quiet pmtiles
          python3 - <<'PY'
          import os
          from pmtiles.reader import MmapSource, all_tiles
          for name in ("regions", "counties"):
              path = f"dashboard/dist/{name}.pmtiles"
              if not os.path.exists(path):
                  continue
              sizes = {}
              with open(path, "rb") as f:
                  for (z, x, y), data in all_tiles(MmapSource(f)):
                      if len(data) > sizes.get(z, (0,))[0]:
                          sizes[z] = (len(data), f"{z}/{x}/{y}")
              for z in sorted(sizes):
                  print(f"{name} zoom {z:2d}: largest tile {sizes[z][1]} {sizes[z][0] / 1024:.0f} KB")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
