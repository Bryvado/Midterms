name: ENR recorder
run-name: ENR recorder (${{ inputs.source }} on ${{ inputs.branch }})

on:
  workflow_dispatch:
    inputs:
      source:
        description: live polls the SOS feed; replay serves a folder of snapshots
        type: choice
        options: [live, replay]
        default: live
      replay_dir:
        description: Replay folder (replay only)
        default: enr/replay/sim_night_01
      election:
        description: SOS election ID (live only)
        default: "53815"
      branch:
        description: Branch that stores the results (enr-2026 for the real night, enr-replay for rehearsals)
        default: enr-2026
      step:
        description: Seconds between header polls or replay snapshots
        default: "15"
      reset_trajectory:
        description: "Live only: auto clears live/ when it holds no counted votes; true always clears it; false keeps it"
        type: choice
        options: [auto, "true", "false"]
        default: auto
      end_utc:
        description: "Live only: no successor run is started after this UTC time"
        default: "2026-11-05T06:00:00"

permissions:
  contents: write
  actions: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BRANCH: ${{ inputs.branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install R packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends r-base-core r-cran-dplyr r-cran-stringr r-cran-jsonlite r-cran-mass r-cran-digest jq
          Rscript -e 'for (p in c("dplyr", "stringr", "jsonlite", "MASS", "digest")) stopifnot(requireNamespace(p, quietly = TRUE))'
      - name: Check out the results branch
        run: |
          git config --global user.name "enr-recorder"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"; then
            git worktree add -q -B "$BRANCH" store "origin/$BRANCH"
          else
            git worktree add -q --detach store
            git -C store checkout -q --orphan "$BRANCH"
            git -C store rm -rq --cached . && git -C store clean -fdxq
          fi
          # A rehearsal starts from an empty series; history keeps the earlier ones.
          if [ "${{ inputs.source }}" = replay ]; then
            [ "$BRANCH" = enr-2026 ] && { echo "A replay may not write to enr-2026." >&2; exit 1; }
            rm -rf store/state store/live store/log store/raw
          fi
          # A live start clears an estimate that holds no counted votes, so the night's trajectory starts empty. A successor keeps it.
          if [ "${{ inputs.source }}" = live ] && [ -f store/live/trajectory.json ]; then
            counted=$(jq '[.[].votes_counted] | max // 0' store/live/trajectory.json)
            if [ "${{ inputs.reset_trajectory }}" = true ] || { [ "${{ inputs.reset_trajectory }}" = auto ] && [ "$counted" = 0 ]; }; then
              rm -f store/live/live.json store/live/trajectory.json
              echo "Cleared live/ (votes counted so far: $counted)."
            else
              echo "Kept live/ (votes counted so far: $counted)."
            fi
          fi
      - name: Record
        run: |
          Rscript enr/R/recorder.R --source=${{ inputs.source }} --replay-dir=${{ inputs.replay_dir }} --election=${{ inputs.election }} \
            --branch="$BRANCH" --step=${{ inputs.step }} --store=store --end-utc=${{ inputs.end_utc }} \
            --site=https://bryvado.github.io/Midterms/data/$([ "${{ inputs.source }}" = replay ] && echo rehearsal || echo live)/live.json | tee report.txt
          { echo '## ENR recorder'; echo; sed 's/^/- /' report.txt; } >> "$GITHUB_STEP_SUMMARY"
